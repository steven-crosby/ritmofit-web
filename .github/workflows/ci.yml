name: CI

# Quality gate for the pnpm monorepo. Deploys stay manual by design (see AGENTS.md) —
# this workflow never deploys, it only blocks regressions on PRs and pushes to main.
# Agents ask the owner, run a final code review, then squash-merge once this job is green
# (AGENTS.md › "Delegation And Merge Policy"), so it is the automated review: keep it thorough.
on:
  push:
    branches: [main]
  pull_request:
    # Label changes do not run this workflow: owner-gate.yml re-evaluates only the PR gates against
    # this head's result here, under the same required check name (RF-100).
    types: [opened, synchronize, reopened]

# pull-requests: write removes a stale `owner-approved`; statuses: read lets the gate check that
# an approval was recorded on this exact commit (owner-gate.yml records it).
permissions:
  contents: read
  pull-requests: write
  statuses: read

# A newer push to the same PR (or to main) cancels the in-flight run. Keyed by PR number, not
# github.ref: a closed PR's event carries the base branch's ref, so an event on a merged PR could
# otherwise cancel main's post-merge push run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: format · typecheck · lint · test · build · audit
    runs-on: ubuntu-latest
    steps:
      # Approval covers only the commit the owner saw. owner-gate.yml records an `owner-approval`
      # commit status on the exact head the owner labelled; the gate below requires both the label
      # and that status on the current head, so a new commit (a push, a branch update, commits
      # pushed while the PR was closed) carries no approval. Agents never create this status by hand.
      # Hygiene: drop the label when new commits arrive so the PR shows it needs a fresh approval.
      # The commit binding above already makes a stale label count for nothing, so a failure here
      # must not skip the real checks. GITHUB_TOKEN edits do not trigger another run.
      - name: Void owner approval on new commits
        continue-on-error: true
        if: github.event_name == 'pull_request' && (github.event.action == 'synchronize' || github.event.action == 'reopened') && contains(github.event.pull_request.labels.*.name, 'owner-approved')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label owner-approved

      - uses: actions/checkout@v4

      # The label-only workflow trusts this job's marker step and shares its name; fail fast if a
      # rename broke either link.
      - name: PR gate workflows agree
        run: bash .github/scripts/pr-gates.sh self-check

      # pnpm/action-setup reads the version from the root package.json
      # "packageManager" field (pnpm@11.4.0), so there's one source of truth.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc # Node 22 (pnpm 11.4 needs >=22.13)
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Owner-gated paths (migrations, auth, provider/playback, CI/deploy, agent rules) fail the
      # job until the owner adds `owner-approved`; product changes must cite their RF record.
      # Both checkers' own tests run first — a checker nobody has watched fail is not a gate.
      # The gates themselves run last, so every other check still reports for the owner.
      - name: Owner gate self-test
        run: pnpm owner-gate:test

      - name: RF trace self-test
        run: pnpm rf-trace:test

      # Changed files plus the base branch's copy of each checker, so a PR cannot loosen the checker
      # that judges it. See .github/scripts/pr-gates.sh.
      - name: Prepare PR gates
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: bash .github/scripts/pr-gates.sh prepare

      # Prettier owns code + top-level docs; generated artifacts and long-form
      # reference docs are excluded in .prettierignore.
      - name: Format check
        run: pnpm format:check

      - name: Repository task system tests
        run: pnpm tasks:test

      - name: Repository task records and board drift
        run: pnpm tasks:check

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm lint

      # Design-system guard gate: tokens.json is the single source of truth, so
      # fail if the generated emitters (web/iOS) drifted, a token lint rule broke,
      # or a semantic color pair fell below its contrast floor. The package has no
      # dependencies, so `npm run verify` runs without an install.
      - name: Design system verify
        working-directory: ritmofit_design_system
        run: npm run verify

      # Catches colour utilities Tailwind never generates — `bg-bg-surface`,
      # `border-border-default`. Neither tsc nor ESLint can see them (a class is
      # just a string), and the failure is silent: a dead bg-* renders transparent
      # while a dead border-* inherits preflight's #E5E7EB and looks deliberate.
      # Twelve shipped before this gate existed; see F-01 in
      # docs/audits/claude-design-audit-2026-07-24/IMPLEMENTATION-KICKOFF.md.
      # The self-test runs first — a checker nobody has watched fail is not a gate.
      - name: Theme class self-test
        run: pnpm --filter @ritmofit/web theme-classes --selftest

      - name: Theme classes resolve
        run: pnpm --filter @ritmofit/web theme-classes

      - name: Test
        run: pnpm test

      # Route-level integration tests run the mounted worker against a real
      # (Miniflare) D1 with prod migrations applied — proves authz is enforced
      # end-to-end. Separate config/glob from the node-env unit suite above.
      - name: Integration tests (Workers pool + D1)
        run: pnpm --filter @ritmofit/api test:integration

      # `vite build` can fail where `tsc --noEmit` passes (asset/import
      # resolution), and deploys are manual — so catch build breaks in CI.
      - name: Build web
        run: pnpm --filter @ritmofit/web build

      # Browser smoke against the build above: sign up, build a Cycle class with mock tracks,
      # write cues, run Live, End Class — at 1440 and 390 wide, with overflow and axe WCAG 2.2
      # AA checks. Mock providers and a throwaway D1; no secrets. It cannot prove real provider
      # playback (AGENTS.md › "Music Constraints"); PRs name that check when it applies.
      - name: Install Playwright Chromium
        run: pnpm --filter @ritmofit/e2e exec playwright install --with-deps chromium

      - name: End-to-end smoke (Playwright)
        run: pnpm --filter @ritmofit/e2e e2e

      # Per-page screenshots for PR review, plus traces on failure. Download from the run's
      # Summary page (zip).
      - name: Upload e2e screenshots and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            e2e/.state/shots/
            e2e/.state/test-results/
          if-no-files-found: ignore
          retention-days: 14

      # The OpenAPI spec is generated from the shared Zod schemas; fail if the
      # committed spec has drifted from a fresh regen.
      - name: OpenAPI spec up to date
        run: |
          pnpm --filter @ritmofit/api openapi
          git diff --exit-code apps/api/openapi/openapi.json

      # Cross-surface contract drift (web ↔ iOS). The design-token seam is already
      # drift-gated above; this gates the *DTO* seam — the vendored iOS run-payload
      # DTOs (ios-snapshot/) must not silently fall behind the contract this backend
      # serves (web-ios-parity.md › "known seam gaps"). Tracked, accepted lag lives
      # in the script's allowlist; a NEW drift (either direction) fails here.
      - name: iOS contract parity (run-payload DTO drift)
        run: pnpm --filter @ritmofit/api contract-parity

      # Production dependency audit. The four esbuild/vite advisories ignored in
      # the audit:ci script are dev/build-server only (not in the deployed Worker
      # or browser bundle) and unfixable without a vite 5→6 major upgrade; they
      # are documented in REVIEW.md. Any NEW advisory fails the build.
      - name: Dependency audit (prod)
        run: pnpm audit:ci

      # Last on purpose: a PR that fails a gate still shows every other check's result.
      - name: RF trace (product PRs cite their RF record)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node "$RUNNER_TEMP/rf-trace.mjs" < "$RUNNER_TEMP/pr-files.txt"

      # owner-gate.yml re-runs only the owner gate on label changes and passes only when this
      # step passed on the head, so it must sit after every other check and before the owner gate.
      - name: All checks except the owner gate passed
        if: ${{ !cancelled() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "Job status before the owner gate: $JOB_STATUS"
          test "$JOB_STATUS" = success

      - name: Owner gate (owner-gated paths need owner-approved)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/pr-gates.sh owner-gate
